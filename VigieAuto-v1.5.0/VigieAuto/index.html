<!doctype html>
<html lang="fr" data-theme="sauge">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#286f4f" />
    <meta
      name="description"
      content="Le carnet de bord gratuit et local de votre véhicule."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="VigieAuto" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="icon" href="./icons/icon-192.png?v=vigie-1.3.1" type="image/png" />

    <input

    <script type="module" src="./js/app.js"></script>
